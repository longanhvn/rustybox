name: Build Multi-Platform Portable Binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 Portable Executable
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: RustyBox-windows-x64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/rust-remote-toolbox.exe

          # Linux (Ubuntu / Debian / Fedora) Portable Binary
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: RustyBox-linux-x64
            binary_path: target/x86_64-unknown-linux-gnu/release/rust-remote-toolbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage named binary
        shell: bash
        run: |
          cp ${{ matrix.binary_path }} ${{ matrix.artifact_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Attach Binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
